<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>똥인가? 하트인가?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #a8edd9 0%, #00b4db 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: relative;
    }
    h1 { font-size: 24px; color: #2c3e50; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 16px; }
    .status-board {
      display: flex;
      justify-content: space-around;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 16px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #475569;
    }
    .status-value { font-weight: 900; color: #0f172a; }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      perspective: 1000px;
    }
    .card {
      aspect-ratio: 1;
      background: #e2e8f0;
      border-radius: 16px;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
      font-size: 26px;
    }
    .card-front {
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      border: 2px solid #cbd5e1;
      color: #64748b;
      font-weight: 900;
    }
    .card-back { transform: rotateY(180deg); background: #ffffff; border: 2px solid #94a3b8; }
    .card.flipped { transform: rotateY(180deg); }
    .card.poop-card.flipped .card-back { background: #fef3c7; border-color: #f59e0b; }
    .card.heart-card.flipped .card-back { background: #ffe4e6; border-color: #fb7185; }
    .card.special-card.flipped .card-back { background: #fef08a; border-color: #eab308; }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #10b981;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      border-radius: 24px; color: white;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .overlay-btn {
      margin-top: 15px; padding: 10px 24px;
      border-radius: 12px; border: none;
      background: #3b82f6; color: white; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>💩 똥이야? 하트야? ❤️</h1>
    <p class="subtitle">상자를 뒤집어 하트를 찾으세요! 똥을 피해야 합니다.</p>

    <div class="status-board">
      <div>점수: <span id="score" class="status-value">0</span></div>
      <div>목숨: <span id="lives" class="status-value">❤️❤️❤️</span></div>
      <div>단계: <span id="stage" class="status-value">1</span></div>
    </div>

    <div class="grid-container" id="grid"></div>
    <button class="btn" onclick="initGame()">새 게임 시작</button>

    <div class="overlay" id="overlay">
      <h2 id="overlay-title">게임 오버! 💩</h2>
      <p id="overlay-msg" style="margin-top:10px;">최종 점수: 0점</p>
      <button class="overlay-btn" onclick="initGame()">다시 도전하기</button>
    </div>
  </div>

  <script>
    const GRID_SIZE = 16;
    let score = 0, lives = 3, stage = 1, flippedCount = 0, targetHearts = 0, isClickable = true;

    function initGame() {
      score = 0; lives = 3; stage = 1;
      document.getElementById('overlay').classList.remove('active');
      setupStage();
    }

    function setupStage() {
      flippedCount = 0; isClickable = true;
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';
      
      document.getElementById('score').textContent = score;
      document.getElementById('stage').textContent = stage;
      updateLives();

      let poopCount = Math.min(3 + stage, 8); 
      let goldHeartCount = 1;
      let heartCount = GRID_SIZE - poopCount - goldHeartCount;
      targetHearts = heartCount + goldHeartCount;

      let cardsData = [];
      for (let i = 0; i < poopCount; i++) cardsData.push({ type: 'poop', icon: '💩', score: -50 });
      for (let i = 0; i < heartCount; i++) cardsData.push({ type: 'heart', icon: '❤️', score: 100 });
      for (let i = 0; i < goldHeartCount; i++) cardsData.push({ type: 'special', icon: '💖', score: 300 });

      cardsData.sort(() => Math.random() - 0.5);

      cardsData.forEach(data => {
        const card = document.createElement('div');
        card.className = `card ${data.type}-card`;
        card.innerHTML = `<div class="card-front">?</div><div class="card-back">${data.icon}</div>`;
        card.onclick = () => {
          if (!isClickable || card.classList.contains('flipped')) return;
          card.classList.add('flipped');

          if (data.type === 'poop') {
            lives--;
            score = Math.max(0, score + data.score);
            updateLives();
            if (lives <= 0) {
              isClickable = false;
              setTimeout(showGameOver, 500);
            }
          } else {
            score += data.score;
            flippedCount++;
            document.getElementById('score').textContent = score;
            if (flippedCount === targetHearts) {
              isClickable = false;
              setTimeout(() => { stage++; setupStage(); }, 600);
            }
          }
        };
        gridEl.appendChild(card);
      });
    }

    function updateLives() {
      document.getElementById('lives').textContent = '❤️'.repeat(lives) || '💀';
    }

    function showGameOver() {
      document.getElementById('overlay-title').textContent = '게임 오버! 💩';
      document.getElementById('overlay-msg').textContent = `최종 점수: ${score}점 (단계: ${stage})`;
      document.getElementById('overlay').classList.add('active');
    }

    initGame();
  </script>
</body>
</html>
